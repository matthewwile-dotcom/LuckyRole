<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Role System - Character Generator & Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --sheet-bg: #111827;
            --primary-gold: #fbbf24;
            --primary-gold-hover: #f59e0b;
            --border-color: #374151;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #1f2937;
            --card-bg: #1a2234;
            --accent-glow: rgba(251, 191, 36, 0.15);
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(30, 41, 59, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .sheet-container {
            max-width: 980px;
            margin: 0 auto;
            background-color: var(--sheet-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .sheet-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #d97706, var(--primary-gold), #d97706);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        p.subtitle {
            margin: 8px 0 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .section-title {
            background: linear-gradient(90deg, rgba(217, 119, 6, 0.2), transparent);
            color: var(--primary-gold);
            padding: 8px 14px;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-left: 4px solid var(--primary-gold);
            border-radius: 0 4px 4px 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        input[type="text"], select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: var(--input-bg);
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .aptitude-card {
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            background-color: var(--card-bg);
            text-align: center;
            transition: transform 0.2s;
        }

        .aptitude-card:hover {
            border-color: rgba(251, 191, 36, 0.4);
        }

        .aptitude-card label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-gold);
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
        }

        .aptitude-card select {
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            padding: 6px;
        }

        .skills-grid, .equipment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            background-color: var(--card-bg);
        }

        .equipment-grid {
            max-height: 320px;
        }

        .skills-grid::-webkit-scrollbar, .equipment-grid::-webkit-scrollbar {
            width: 8px;
        }
        .skills-grid::-webkit-scrollbar-track, .equipment-grid::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 4px;
        }
        .skills-grid::-webkit-scrollbar-thumb, .equipment-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        .skills-grid::-webkit-scrollbar-thumb:hover, .equipment-grid::-webkit-scrollbar-thumb:hover {
            background: var(--primary-gold);
        }

        @media (max-width: 800px) {
            .skills-grid, .equipment-grid {
                grid-template-columns: 1fr;
            }
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .skill-row-box, .equipment-row-box {
            display: flex;
            gap: 10px;
            background: var(--input-bg);
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            align-items: center;
        }

        .skill-row-box select, .equipment-row-box input {
            flex: 1;
            padding: 6px 10px;
            font-size: 0.85rem;
        }

        .skill-row-box .degree-select {
            width: 130px;
            font-size: 0.85rem;
        }

        .actions {
            margin-top: 35px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
            background-color: var(--accent-glow);
        }

        .btn-generate {
            background-color: var(--primary-gold);
            color: #0b0f19;
            border-color: var(--primary-gold);
        }

        .btn-generate:hover {
            background-color: var(--primary-gold-hover);
            color: #0b0f19;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @media print {
            body {
                background-color: #fff;
                color: #1e293b;
                padding: 0;
            }
            .sheet-container {
                border: none;
                box-shadow: none;
                padding: 0;
                max-width: 100%;
                background-color: #fff;
            }
            .sheet-container::before {
                display: none;
            }
            .actions {
                display: none;
            }
            input[type="text"], select {
                border: none;
                border-bottom: 1px solid #000;
                border-radius: 0;
                padding: 4px 0;
                background: transparent;
                color: #000;
            }
            .skills-grid, .equipment-grid {
                max-height: none;
                overflow: visible;
                border: none;
                background: transparent;
            }
            .skill-row-box, .equipment-row-box {
                border: 1px solid #cbd5e1;
                background: transparent;
            }
            .section-title {
                background: #f1f5f9;
                color: #0f172a;
                border-left-color: #0f172a;
            }
            .aptitude-card {
                background: #f8fafc;
                border-color: #cbd5e1;
            }
            .aptitude-card label {
                color: #0f172a;
            }
        }
    </style>
</head>
<body>

<div class="sheet-container">
    <header>
        <h1>Lucky Role System</h1>
        <p class="subtitle">Character Generator & Record Sheet</p>
    </header>

    <!-- Character Identity -->
    <div class="section-title">Character Details</div>
    <div class="grid-2">
        <div class="form-field">
            <label for="charName">Character Name</label>
            <input type="text" id="charName" value="Kaelen Vane" placeholder="Enter character name...">
        </div>
        <div class="form-field">
            <label for="charPlayer">Player Name</label>
            <input type="text" id="charPlayer" placeholder="Enter player name...">
        </div>
        <div class="form-field">
            <label for="charSetting">Setting Framework</label>
            <select id="charSetting" onchange="onSettingChange()">
                <option value="sci-fi">Sci-Fi / Interstellar</option>
                <option value="fantasy">Classic Fantasy</option>
            </select>
        </div>
        <div class="form-field">
            <label for="charSpecies">Species Origin</label>
            <select id="charSpecies" onchange="onSelectionChange()">
                <!-- Populated dynamically -->
            </select>
        </div>
        <div class="form-field" style="grid-column: span 2;">
            <label for="charProfession">Profession Specialization</label>
            <select id="charProfession" onchange="onSelectionChange()">
                <!-- Populated dynamically -->
            </select>
        </div>
    </div>

    <!-- Aptitudes -->
    <div class="section-title">Aptitudes & Core Ratings</div>
    <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: -6px; margin-bottom: 14px;">
        Degrees: Inept (-2 / D4), Untrained (0 / D6), Trained (+2 / D8), Expert (+4 / D10), Genius (+6 / D12)
    </p>
    <div class="grid-4" id="aptitudesGrid">
        <div class="aptitude-card">
            <label>Might</label>
            <select id="aptMight">
                <option>Inept (-2 / D4)</option><option>Untrained (0 / D6)</option><option selected>Trained (+2 / D8)</option><option>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
        <div class="aptitude-card">
            <label>Agility</label>
            <select id="aptAgility">
                <option>Inept (-2 / D4)</option><option>Untrained (0 / D6)</option><option selected>Trained (+2 / D8)</option><option>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
        <div class="aptitude-card">
            <label>Vigor</label>
            <select id="aptVigor">
                <option>Inept (-2 / D4)</option><option selected>Untrained (0 / D6)</option><option>Trained (+2 / D8)</option><option>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
        <div class="aptitude-card">
            <label>Intellect</label>
            <select id="aptIntellect">
                <option>Inept (-2 / D4)</option><option>Untrained (0 / D6)</option><option selected>Trained (+2 / D8)</option><option>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
        <div class="aptitude-card">
            <label>Awareness</label>
            <select id="aptAwareness">
                <option>Inept (-2 / D4)</option><option selected>Untrained (0 / D6)</option><option>Trained (+2 / D8)</option><option>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
        <div class="aptitude-card">
            <label>Presence</label>
            <select id="aptPresence">
                <option>Inept (-2 / D4)</option><option selected>Untrained (0 / D6)</option><option>Trained (+2 / D8)</option><option>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
        <div class="aptitude-card">
            <label>Will</label>
            <select id="aptWill">
                <option>Inept (-2 / D4)</option><option selected>Untrained (0 / D6)</option><option>Trained (+2 / D8)</option><option>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
        <div class="aptitude-card">
            <label>Tech / Mysticism</label>
            <select id="aptTech">
                <option>Inept (-2 / D4)</option><option>Untrained (0 / D6)</option><option>Trained (+2 / D8)</option><option selected>Expert (+4 / D10)</option><option>Genius (+6 / D12)</option>
            </select>
        </div>
    </div>

    <!-- Skills Matrix -->
    <div class="section-title">Skills Matrix (30 Open Slots)</div>
    <div class="skills-grid" id="skillsGrid"></div>

    <!-- Equipment & Experience Points -->
    <div class="section-title">Equipment & Experience Points</div>
    <div class="grid-2" style="margin-bottom: 14px;">
        <div class="form-field">
            <label>Experience Points (XP)</label>
            <input type="text" id="charXP" value="0 Available / 15 Total">
        </div>
        <div class="form-field">
            <label>Currency / Funds</label>
            <input type="text" id="charFunds" value="500 Credits / Gold Pieces">
        </div>
    </div>

    <label style="margin-bottom: 6px; display: block;">Equipment Inventory (20 Slots)</label>
    <div class="equipment-grid" id="equipmentGrid"></div>

    <!-- Export Action -->
    <div class="actions">
        <button class="btn btn-generate" onclick="generateRandomCharacter()">Auto-Generate Character</button>
        <button class="btn" onclick="window.print()">Print / Save as PDF</button>
    </div>
</div>

    function onSettingChange() {
        const setting = document.getElementById('charSetting').value;
        const speciesSelect = document.getElementById('charSpecies');
        const professionSelect = document.getElementById('charProfession');

        speciesSelect.innerHTML = '';
        dataBySetting[setting].species.forEach(sp => {
            const opt = document.createElement('option');
            opt.value = sp;
            opt.textContent = sp;
            speciesSelect.appendChild(opt);
        });

        professionSelect.innerHTML = '';
        dataBySetting[setting].professions.forEach(prof => {
            const opt = document.createElement('option');
            opt.value = prof;
            opt.textContent = prof;
            professionSelect.appendChild(opt);
        });

        initSkillsGrid();
        initEquipmentGrid();
    }

    function initSkillsGrid() {
        const container = document.getElementById('skillsGrid');
        container.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            const row = document.createElement('div');
            row.className = 'skill-row-box';

            const sSelect = document.createElement('select');
            sSelect.className = 'skill-select';
            skillsList.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s === "-- Select Skill --" ? "" : s;
                opt.textContent = s;
                sSelect.appendChild(opt);
            });

            const dSelect = document.createElement('select');
            dSelect.className = 'degree-select';
            degrees.forEach((d, idx) => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                if (idx === 1) opt.selected = true;
                dSelect.appendChild(opt);
            });

            row.appendChild(sSelect);
            row.appendChild(dSelect);
            container.appendChild(row);
        }
        
        onSelectionChange();
    }

    function initEquipmentGrid() {
        const container = document.getElementById('equipmentGrid');
        container.innerHTML = '';
        const setting = document.getElementById('charSetting').value;
        const defaultList = dataBySetting[setting].defaultGear;

        for (let i = 1; i <= 20; i++) {
            const row = document.createElement('div');
            row.className = 'equipment-row-box';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'equipment-input';
            input.placeholder = `Item slot ${i}...`;
            if (i <= defaultList.length) {
                input.value = defaultList[i - 1];
            }

            row.appendChild(input);
            container.appendChild(row);
        }
    }

    function onSelectionChange() {
        const selectedSpecies = document.getElementById('charSpecies').value;
        const selectedProfession = document.getElementById('charProfession').value;

        const speciesSkills = baseSpeciesSkills[selectedSpecies] || [];
        const professionSkills = universalProfessionSkills[selectedProfession] || [];

        const allUniqueSkills = [...new Set([...speciesSkills, ...professionSkills])];

        const skillSelects = document.querySelectorAll('.skill-select');
        const degreeSelects = document.querySelectorAll('.degree-select');

        skillSelects.forEach((select, idx) => {
            select.selectedIndex = 0;
            degreeSelects[idx].selectedIndex = 1; // Default Untrained
        });

        allUniqueSkills.forEach((skill, idx) => {
            if (idx < skillSelects.length) {
                skillSelects[idx].value = skill;

                const isInSpecies = speciesSkills.includes(skill);
                const isInProfession = professionSkills.includes(skill);

                if (isInSpecies && isInProfession) {
                    degreeSelects[idx].selectedIndex = 3; // Expert (+4 / D10)
                } else {
                    degreeSelects[idx].selectedIndex = 2; // Trained (+2 / D8)
                }
            }
        });
    }

    function generateRandomCharacter() {
        const firstNames = ["Kaelen", "Lyra", "Jax", "Varis", "Nyx", "Orion", "Thalia", "Zephyr", "Cora", "Dax"];
        const lastNames = ["Vane", "Stark", "Shadowweaver", "Voss", "Sterling", "Cross", "Dawnrunner", "Nox", "Valen", "Rix"];
        document.getElementById('charName').value = firstNames[Math.floor(Math.random() * firstNames.length)] + " " + lastNames[Math.floor(Math.random() * lastNames.length)];
        document.getElementById('charPlayer').value = "Operative One";

        const settings = ["sci-fi", "fantasy"];
        const chosenSetting = settings[Math.floor(Math.random() * settings.length)];
        document.getElementById('charSetting').value = chosenSetting;
        onSettingChange();

        const speciesOpts = document.getElementById('charSpecies').options;
        document.getElementById('charSpecies').selectedIndex = Math.floor(Math.random() * speciesOpts.length);

        const profOpts = document.getElementById('charProfession').options;
        document.getElementById('charProfession').selectedIndex = Math.floor(Math.random() * profOpts.length);

        onSelectionChange();

        const apts = ['aptMight', 'aptAgility', 'aptVigor', 'aptIntellect', 'aptAwareness', 'aptPresence', 'aptWill', 'aptTech'];
        apts.forEach(aptId => {
            const selectEl = document.getElementById(aptId);
            selectEl.selectedIndex = Math.floor(Math.random() * selectEl.options.length);
        });
    }
